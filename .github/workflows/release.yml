name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get tag
        id: get_tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release (generate notes, mark latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.get_tag.outputs.tag }}"
          VERSION="${{ steps.get_version.outputs.version }}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes-${TAG}.md"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="${GITHUB_SHA}" \
            --jq .body > "$NOTES_FILE"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Release ${VERSION}" \
              --notes-file "$NOTES_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --latest
          else
            gh release create "$TAG" \
              --title "Release ${VERSION}" \
              --notes-file "$NOTES_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --latest
          fi

  build:
    name: Build
    needs: create-release
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates curl git \
            build-essential pkg-config \
            cpio zstd \
            busybox-static \
            util-linux \
            fdisk \
            parted \
            e2fsprogs \
            efibootmgr \
            debootstrap debian-archive-keyring \
            python3 \
            systemd \
            systemd-boot-efi \
            grub-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            file \
            xorriso \
            dosfstools mtools \
            jq

      - name: Free disk space (runner)
        run: |
          set -euo pipefail
          echo "==> Disk usage (before cleanup)"
          df -h

          # GitHub-hosted runners ship large preinstalls we don't need.
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true

          # Reduce apt footprint.
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "==> Disk usage (after cleanup)"
          df -h

      - name: Build Debian rootfs payload (bookworm, amd64)
        run: |
          set -euo pipefail

          echo "==> Disk usage (before debootstrap)"
          df -h

          chmod +x ./build_rootfs_payload.sh
          export TRUTHDB_SOURCE=release
          export TRUTHDB_REPO=Truthdb/truthdb
          export ROOTFS_DIR="${PWD}/debian-rootfs"
          export PAYLOAD_PATH="${PWD}/debian-minbase-amd64-bookworm.tar.zst"
          ./build_rootfs_payload.sh

          echo "==> Disk usage (after packing payload)"
          df -h

          ls -lh "${PAYLOAD_PATH}"
          echo "ROOTFS_PAYLOAD=${PAYLOAD_PATH}" >> "$GITHUB_ENV"
      
      - name: Download matching installer binary
        run: |
          set -euo pipefail
          echo "Resolving latest installer release"

          RELEASE=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Truthdb/installer/releases/latest")

          DEP_TAG=$(echo "$RELEASE" | jq -r '.tag_name')
          echo "Using installer release: ${DEP_TAG}"
          
          # Download the installer binary
          DOWNLOAD_URL=$(echo "$RELEASE" | jq -r '.assets // [] | .[] | select(.name | contains("truthdb-installer")) | select(.name | endswith(".tar.gz")) | .browser_download_url' | head -n 1)
          CHECKSUM_URL=$(echo "$RELEASE" | jq -r '.assets // [] | .[] | select(.name | contains("truthdb-installer")) | select(.name | endswith(".sha256")) | .browser_download_url' | head -n 1)
          
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "No installer binary found in release"
            exit 1
          fi
          if [ -z "$CHECKSUM_URL" ] || [ "$CHECKSUM_URL" = "null" ]; then
            echo "No installer checksum found in release"
            exit 1
          fi
          
          echo "Downloading installer from: $DOWNLOAD_URL"
          mkdir -p installer-bin
          cd installer-bin
          curl -fsSL -o installer.tar.gz "$DOWNLOAD_URL"
          curl -fsSL -o truthdb-installer.sha256 "$CHECKSUM_URL"
          tar xzf installer.tar.gz
          expected_installer_sha=$(awk 'NR==1 {print $1}' truthdb-installer.sha256)
          actual_installer_sha=$(sha256sum truthdb-installer | awk '{print $1}')
          if [ -z "$expected_installer_sha" ] || [ "$expected_installer_sha" != "$actual_installer_sha" ]; then
            echo "ERROR: installer checksum verification failed"
            echo "Expected: ${expected_installer_sha:-<empty>}"
            echo "Actual:   $actual_installer_sha"
            exit 1
          fi
          chmod +x truthdb-installer
          cd ..
          
          # Verify the binary exists
          ls -lh installer-bin/truthdb-installer
          file installer-bin/truthdb-installer
      
      - name: Download matching kernel
        run: |
          set -euo pipefail
          echo "Resolving latest installer-kernel release"

          RELEASE=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Truthdb/installer-kernel/releases/latest")

          DEP_TAG=$(echo "$RELEASE" | jq -r '.tag_name')
          echo "Using installer-kernel release: ${DEP_TAG}"
          
          # Download the kernel (BOOTX64.EFI)
          DOWNLOAD_URL=$(echo "$RELEASE" | jq -r '.assets // [] | .[] | select(.name == "BOOTX64.EFI") | .browser_download_url' | head -n 1)
          CHECKSUM_URL=$(echo "$RELEASE" | jq -r '.assets // [] | .[] | select(.name == "BOOTX64.EFI.sha256") | .browser_download_url' | head -n 1)
          
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "No BOOTX64.EFI found in release"
            exit 1
          fi
          if [ -z "$CHECKSUM_URL" ] || [ "$CHECKSUM_URL" = "null" ]; then
            echo "No BOOTX64.EFI.sha256 found in release"
            exit 1
          fi
          
          echo "Downloading kernel from: $DOWNLOAD_URL"
          mkdir -p kernel-bin
          curl -fsSL -o kernel-bin/BOOTX64.EFI "$DOWNLOAD_URL"
          curl -fsSL -o kernel-bin/BOOTX64.EFI.sha256 "$CHECKSUM_URL"
          (
            cd kernel-bin
            sha256sum -c BOOTX64.EFI.sha256
          )
          
          # Verify the kernel exists
          ls -lh kernel-bin/BOOTX64.EFI
          file kernel-bin/BOOTX64.EFI
      
      - name: Build ISO
        run: |
          export KERNEL_SRC="${PWD}/kernel-bin/BOOTX64.EFI"
          export INSTALLER_BIN="${PWD}/installer-bin/truthdb-installer"
          export ROOTFS_PAYLOAD="${ROOTFS_PAYLOAD}"
          export ISO_NAME="truthdb-installer.iso"

          ls -lh "$KERNEL_SRC" "$INSTALLER_BIN" "$ROOTFS_PAYLOAD"
          chmod +x ./build_iso.sh
          ./build_iso.sh

          rm -f "$ROOTFS_PAYLOAD" || true
          rm -rf installer-bin kernel-bin || true
      
      - name: Generate checksum
        run: |
          sha256sum truthdb-installer.iso > truthdb-installer-v${{ needs.create-release.outputs.version }}.iso.sha256
          cat truthdb-installer-v${{ needs.create-release.outputs.version }}.iso.sha256
      
      - name: Rename ISO with version
        run: |
          mkdir -p dist
          mv truthdb-installer.iso "dist/truthdb-installer-v${{ needs.create-release.outputs.version }}.iso"
          mv truthdb-installer-v${{ needs.create-release.outputs.version }}.iso.sha256 "dist/truthdb-installer-v${{ needs.create-release.outputs.version }}.iso.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  upload:
    name: Upload
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(./dist/*)
          if (( ${#files[@]} == 0 )); then
            echo "No release assets found; skipping upload."
            exit 0
          fi
          gh release upload "${{ needs.create-release.outputs.tag }}" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
