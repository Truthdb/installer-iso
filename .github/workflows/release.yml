name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    uses: Truthdb/.github/.github/workflows/standard-release.yml@workflows-v1
    with:
      project_name: installer-iso
      runs_on: ubuntu-24.04
      install_packages: |
        ca-certificates curl git
        build-essential pkg-config
        cpio zstd
        busybox-static
        python3
        systemd-ukify
        systemd-boot-efi
        file
        xorriso
        dosfstools mtools
        jq
      assets_list: |
        - truthdb-installer-v$VERSION.iso
        - truthdb-installer-v$VERSION.iso.sha256
      build_script: |
        set -euo pipefail

        echo "Looking for installer version v${VERSION}"
        release=$(curl -fsSL \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/Truthdb/installer/releases/tags/v${VERSION}" || true)

        if echo "$release" | jq -e '.message == "Not Found"' > /dev/null; then
          echo "No matching release v${VERSION} found in installer repo; falling back to latest release"
          release=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Truthdb/installer/releases/latest)
        fi

        download_url=$(echo "$release" | jq -r '.assets // [] | .[] | select(.name | contains("truthdb-installer")) | select(.name | endswith(".tar.gz")) | .browser_download_url' | head -n 1)
        [[ -n "$download_url" && "$download_url" != "null" ]] || { echo "No installer binary found in release"; exit 1; }

        mkdir -p installer-bin
        (cd installer-bin && curl -fsSL -o installer.tar.gz "$download_url" && tar xzf installer.tar.gz && chmod +x truthdb-installer)

        echo "Looking for kernel version v${VERSION}"
        kernel_release=$(curl -fsSL \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/Truthdb/installer-kernel/releases/tags/v${VERSION}")

        kernel_url=$(echo "$kernel_release" | jq -r '.assets // [] | .[] | select(.name == "BOOTX64.EFI") | .browser_download_url' | head -n 1)
        [[ -n "$kernel_url" && "$kernel_url" != "null" ]] || { echo "No BOOTX64.EFI found in kernel release"; exit 1; }

        mkdir -p kernel-bin
        curl -fsSL -o kernel-bin/BOOTX64.EFI "$kernel_url"

        export KERNEL_SRC="${PWD}/kernel-bin/BOOTX64.EFI"
        export INSTALLER_BIN="${PWD}/installer-bin/truthdb-installer"
        export ISO_NAME="truthdb-installer.iso"

        ls -lh "$KERNEL_SRC" "$INSTALLER_BIN"

        rm -rf rootfs
        mkdir -p rootfs/{bin,sbin,etc,proc,sys,dev,run,tmp}

        cp /bin/busybox rootfs/bin/busybox
        chmod +x rootfs/bin/busybox
        ln -sf /bin/busybox rootfs/sbin/init
        ln -sf /bin/busybox rootfs/bin/sh

        cp "$INSTALLER_BIN" rootfs/bin/truthdb-installer
        chmod +x rootfs/bin/truthdb-installer

        cat > rootfs/etc/inittab <<'EOF'
        ::sysinit:/bin/busybox mount -t proc proc /proc
        ::sysinit:/bin/busybox mount -t sysfs sysfs /sys
        ::sysinit:/bin/busybox mount -t devtmpfs devtmpfs /dev
        ::respawn:/bin/truthdb-installer
        ::restart:/bin/busybox reboot -f
        EOF

        rm -f initramfs.cpio initramfs.cpio.zst
        ( cd rootfs && find . -print0 | cpio --null -ov --format=newc ) > initramfs.cpio
        zstd -19 -T0 initramfs.cpio -o initramfs.cpio.zst

        cat > cmdline.txt <<'EOF'
        console=ttyS0 earlyprintk=serial loglevel=7 rdinit=/sbin/init
        EOF

        cp "$KERNEL_SRC" ./vmlinuz

        ukify build \
          --linux ./vmlinuz \
          --initrd ./initramfs.cpio.zst \
          --cmdline @./cmdline.txt \
          --output ./TruthDBInstaller.efi

        rm -f efi.img
        dd if=/dev/zero of=efi.img bs=1M count=128
        mkfs.vfat -F 32 efi.img

        mmd   -i efi.img ::/EFI
        mmd   -i efi.img ::/EFI/BOOT
        mcopy -i efi.img ./TruthDBInstaller.efi ::/EFI/BOOT/BOOTX64.EFI

        rm -f "$ISO_NAME"
        xorriso -as mkisofs \
          -R -J \
          -o "$ISO_NAME" \
          -eltorito-alt-boot \
          -e efi.img \
          -no-emul-boot \
          -isohybrid-gpt-basdat \
          -graft-points efi.img=efi.img

        sha256sum "$ISO_NAME" > "truthdb-installer-v${VERSION}.iso.sha256"

        mkdir -p dist
        mv "$ISO_NAME" "dist/truthdb-installer-v${VERSION}.iso"
        mv "truthdb-installer-v${VERSION}.iso.sha256" "dist/truthdb-installer-v${VERSION}.iso.sha256"
