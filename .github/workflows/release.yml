name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get tag
        id: get_tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release (generate notes, mark latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.get_tag.outputs.tag }}"
          VERSION="${{ steps.get_version.outputs.version }}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes-${TAG}.md"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="${GITHUB_SHA}" \
            --jq .body > "$NOTES_FILE"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Release ${VERSION}" \
              --notes-file "$NOTES_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --latest
          else
            gh release create "$TAG" \
              --title "Release ${VERSION}" \
              --notes-file "$NOTES_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --latest
          fi

  build:
    name: Build
    needs: create-release
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # The same script developers run. Every input comes from the release with
      # this same tag (release-iso tags all repos with one version), never from
      # "latest".
      - name: Build ISO
        env:
          INPUT_MODE: release
          KERNEL_TAG: ${{ needs.create-release.outputs.tag }}
          INSTALLER_TAG: ${{ needs.create-release.outputs.tag }}
          TRUTHDB_TAG: ${{ needs.create-release.outputs.tag }}
          ISO_NAME: truthdb-installer.iso
        run: ./build_in_container.sh

      - name: Rename ISO with version
        run: |
          mkdir -p dist
          mv truthdb-installer.iso "dist/truthdb-installer-v${{ needs.create-release.outputs.version }}.iso"

      # Hash the ISO under its published name, so `sha256sum -c` works on a
      # download of the two release assets.
      - name: Generate checksum
        working-directory: dist
        run: |
          sha256sum truthdb-installer-v${{ needs.create-release.outputs.version }}.iso > truthdb-installer-v${{ needs.create-release.outputs.version }}.iso.sha256
          cat truthdb-installer-v${{ needs.create-release.outputs.version }}.iso.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  # Nothing is attached to the release unless the ISO verifies against its
  # checksum and installs.
  e2e:
    name: Install test
    needs: [create-release, build]
    uses: ./.github/workflows/e2e.yml
    with:
      iso-artifact: release-assets
      release-tag: ${{ needs.create-release.outputs.tag }}

  upload:
    name: Upload
    needs: [create-release, build, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(./dist/*)
          if (( ${#files[@]} == 0 )); then
            echo "No release assets found; skipping upload."
            exit 0
          fi
          gh release upload "${{ needs.create-release.outputs.tag }}" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
