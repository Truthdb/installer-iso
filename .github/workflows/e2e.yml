name: Install test

# Takes the installer ISO the release built earlier in the same run, installs it
# onto a blank disk in QEMU, and checks the installed system. Called from the
# installer-iso release only: nothing is published unless it passes.

on:
  workflow_call:
    inputs:
      release-tag:
        description: The release whose truthdb-cli checks the installed server
        type: string
        required: true
      iso-artifact:
        description: The ISO artifact (with its .sha256) from the same run
        type: string
        required: true

permissions:
  contents: read

jobs:
  install-test:
    name: Install in QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release-tag }}
    steps:
      - name: Check out installer-iso
        uses: actions/checkout@v4
        with:
          path: installer-iso

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf mtools fdisk xorriso zstd cpio

      - name: Fetch truthdb-cli from the release
        run: |
          set -euo pipefail
          mkdir -p cli
          gh release download ${RELEASE_TAG} -R Truthdb/truthdb -p 'truthdb-cli_*_amd64.deb' -D cli
          dpkg-deb -x cli/truthdb-cli_*_amd64.deb cli/root
          echo "TRUTHDB_CLI=${PWD}/cli/root/usr/bin/truthdb-cli" >> "$GITHUB_ENV"

      - name: Download the ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.iso-artifact }}
          path: iso

      - name: Verify the ISO checksum
        working-directory: iso
        run: |
          set -euo pipefail
          sha256sum -c ./*.iso.sha256
          echo "ISO=$(realpath ./*.iso)" >> "$GITHUB_ENV"

      # The installer runs its tools with PATH=/bin:/sbin:/usr/bin:/usr/sbin. A
      # tool copied anywhere else is unreachable at install time.
      - name: Check initramfs tools are on the installer's PATH
        run: |
          set -euo pipefail
          osirrox -indev "${ISO}" -extract /boot/truthdb/initrd.img initrd.img
          zstd -dc initrd.img | cpio -t --quiet > initrd.list
          missing=0
          for cmd in wipefs sfdisk partprobe blkid mkfs.vfat mkfs.ext4 mount umount tar zstd chroot efibootmgr; do
            if ! grep -qxE "(bin|sbin|usr/bin|usr/sbin)/${cmd}" initrd.list; then
              echo "ERROR: ${cmd} is not on the installer's PATH in the initramfs:"
              grep -E "/${cmd}\$" initrd.list || true
              missing=1
            fi
          done
          exit "${missing}"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "no /dev/kvm; the test falls back to software emulation"

      - name: Install and check
        run: installer-iso/tests/e2e/run.sh "${ISO}" "${TRUTHDB_CLI}" e2e-out

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e-out/*.log
          if-no-files-found: ignore
