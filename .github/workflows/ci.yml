name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Shellcheck
        run: shellcheck ./build_and_run.sh ./build_in_container.sh ./build_iso.sh ./build_rootfs_payload.sh ./run_container.sh ./initramfs/init ./tests/e2e/run.sh

  install-test:
    name: Install test
    uses: ./.github/workflows/e2e.yml
